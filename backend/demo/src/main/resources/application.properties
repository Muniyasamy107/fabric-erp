# Server Port
server.port=${PORT:8083}

# Database Configuration
# Override via environment variables in production, e.g.:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luxury_fabric_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:munish2000}

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Forms may submit empty strings for optional numeric fields; treat them as null
# spring.jackson.deserialization.accept-empty-string-as-null-object=true

# JWT Secret - ALWAYS override JWT_SECRET with a strong secret in production
jwt.secret=${JWT_SECRET:RoyalFabricERPSecretKeyMustBeAtLeast32CharsLong2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

